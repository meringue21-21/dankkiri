<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1a5fd6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="단끼리">
<link rel="apple-touch-icon" href="icon-192.png">
<title>단끼리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: single phone-width column, ocean-blue ink on cool paper, coral reserved for streak/attention. */
:root{
  --bg:#F2F6FA; --surface:#FFFFFF; --ink:#0F2740; --muted:#5B7089; --line:#DCE5EE;
  --sea:#1668D9; --sea-soft:#E3EEFD; --coral:#E8502A; --ok:#168A5B; --ok-soft:#DDF3E8;
  --bad:#C93A3A; --bad-soft:#FBE3E3; --gold:#C98A00;
  --font-display:'Jua','Noto Sans KR',sans-serif;
  --font-body:'Noto Sans KR','Noto Sans',system-ui,sans-serif;
  --font-latin:'Noto Sans','Noto Sans KR',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1622; --surface:#122233; --ink:#E8F0F8; --muted:#92A6BC; --line:#223850;
    --sea:#5AA2FF; --sea-soft:#17304F; --coral:#FF7F5E; --ok:#4CC38A; --ok-soft:#12362A;
    --bad:#FF7A7A; --bad-soft:#3B1D22; --gold:#F2C14E; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1622; --surface:#122233; --ink:#E8F0F8; --muted:#92A6BC; --line:#223850;
  --sea:#5AA2FF; --sea-soft:#17304F; --coral:#FF7F5E; --ok:#4CC38A; --ok-soft:#12362A;
  --bad:#FF7A7A; --bad-soft:#3B1D22; --gold:#F2C14E; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);-webkit-text-size-adjust:100%}
body{min-height:100%;font-size:15px}
.toggle button,.seg button{font-size:14px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
#app{max-width:520px;margin:0 auto;padding:16px 16px 104px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
.disp{font-family:var(--font-display);font-weight:400}
.muted{color:var(--muted)}
.small{font-size:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.col{display:flex;flex-direction:column;gap:10px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:13px 16px;font-weight:700;font-size:14px;min-height:48px}
.btn.primary{background:var(--sea);border-color:var(--sea);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#06182B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#06182B}}
.btn.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.btn.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:20px;line-height:1}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;background:var(--sea-soft);color:var(--sea)}
.tiny{border:0;background:none;color:var(--muted);font-size:12px;padding:6px 4px;text-decoration:underline;opacity:.8;min-height:0}
.schip{display:inline-flex;align-items:center;border:0;border-radius:999px;padding:6px 11px;font-size:12px;font-weight:700;min-height:32px;background:var(--sea-soft);color:var(--muted)}
.schip.ok{background:var(--ok-soft);color:var(--ok)}
.schip.warn{background:color-mix(in srgb,var(--gold) 22%,transparent);color:var(--ink)}
.schip.bad{background:var(--bad-soft);color:var(--bad)}
.timer{font-weight:700;font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted);min-width:44px;text-align:right}
.timer.low{color:var(--bad)}
.inp+.inp{margin-top:8px}
sup.bn{font-weight:700;font-size:11px;color:var(--sea);margin-left:1px}
.chip.coral{background:color-mix(in srgb,var(--coral) 16%,transparent);color:var(--coral)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.bar{height:10px;background:var(--sea-soft);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--sea);border-radius:99px;transition:width .3s}
.bar.ok>i{background:var(--ok)}
.top{display:flex;align-items:center;gap:12px}
.top .bar{flex:1}
.top .count{font-weight:700;font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted);min-width:56px;text-align:right}

/* header */
.head{display:flex;align-items:center;justify-content:space-between}
.head h1{font-family:var(--font-display);font-size:26px;font-weight:400}

/* hero */
.hero{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,var(--sea-soft),var(--surface));}
.elephant{flex:none;height:auto;border-radius:22px;animation:bob 3.2s ease-in-out infinite;transform-origin:50% 100%}
@keyframes bob{50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion: reduce){.elephant{animation:none}}
.el-b{fill:var(--sea);stroke:var(--surface);stroke-width:2}
.el-t{stroke:var(--sea);fill:none;stroke-linecap:round}
.hero-art{width:150px;display:flex;justify-content:center;align-items:flex-end;flex:none}
.streak{font-family:var(--font-display);font-size:44px;line-height:1;color:var(--coral);font-variant-numeric:tabular-nums}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.strip div{display:flex;flex-direction:column;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;font-weight:700}
.dot.on{background:var(--sea);border-color:var(--sea);color:#fff}
:root[data-theme="dark"] .dot.on{color:#06182B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .dot.on{color:#06182B}}
.dot.now{border-color:var(--coral)}
.steps{display:flex;gap:8px}
.step{flex:1;border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:13px;font-weight:700;color:var(--muted);display:flex;gap:6px;align-items:center}
.step.done{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.step.cur{border-color:var(--sea);color:var(--sea)}
.big{font-family:var(--font-display);font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}

/* word card */
.wcard{padding:18px 16px;height:50vh;height:50dvh;min-height:0;overflow:hidden}
.wfit{display:flex;flex-direction:column;gap:12px;transform-origin:top left}
.word{font-family:var(--font-latin);font-weight:700;font-size:32px;line-height:1.1;overflow-wrap:anywhere}
.ipa{font-family:var(--font-latin);color:var(--sea);font-size:15px}
.mean{font-size:18px;font-weight:700}
.mean2{font-size:16px;font-weight:700}
.mean2 b{font-weight:500;color:var(--muted);margin-right:4px}
.ex{font-family:var(--font-latin);font-size:14px;line-height:1.55;padding:12px 14px;border-left:4px solid var(--sea);background:var(--sea-soft);border-radius:0 12px 12px 0}
.ex mark{background:none;color:var(--sea);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.df{font-family:var(--font-latin);font-size:14px;line-height:1.5;padding:10px 12px;border-left:4px solid var(--coral);background:color-mix(in srgb,var(--coral) 10%,transparent);border-radius:0 12px 12px 0}
.df mark{background:none;color:var(--coral);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.veil{filter:blur(9px);user-select:none;-webkit-user-select:none}
.veil.unveil{filter:none}
#app.holdmode,#app.holdmode *{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#app.fit{padding-bottom:calc(16px + env(safe-area-inset-bottom));transform-origin:top center}

.act .btn{min-height:56px;font-size:16px}
.hold,.hold *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
.tap-hint{font-size:13px;color:var(--muted)}
.star{color:var(--muted)} .star.on{color:var(--gold);border-color:var(--gold)}

/* quiz */
.q{display:flex;flex-direction:column;gap:14px}
.qprompt{font-size:14px;color:var(--muted);font-weight:700}
.qmain{font-family:var(--font-latin);font-size:25px;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.qmain.ko{font-family:var(--font-body);font-size:22px}
.qmain.sent{font-size:16px;font-weight:500;line-height:1.7}
.blank{display:inline-block;min-width:92px;border-bottom:3px solid var(--sea);margin:0 4px;vertical-align:baseline}
.opts{display:flex;flex-direction:column;gap:10px}
#app.tight .q{gap:8px}#app.tight .opts{gap:6px}#app.tight .opt{min-height:44px;padding:7px 12px}#app.tight .fb{padding:10px;gap:5px}#app.tight .top{margin-bottom:6px}.fb{position:relative}.fbhide{position:absolute;right:12px;top:10px}
.opt{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;font-size:14px;font-weight:500;display:flex;gap:12px;align-items:center;min-height:56px}
.opt b{width:28px;height:28px;border-radius:50%;background:var(--sea-soft);color:var(--sea);display:grid;place-items:center;font-size:13px;flex:none}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.inp{width:100%;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;font-size:17px;font-family:var(--font-latin)}
.inp:focus{border-color:var(--sea);outline:none}
.inp.right{border-color:var(--ok);background:var(--ok-soft)}
.inp.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.fb.ok{background:var(--ok-soft);border:1px solid var(--ok)}
.fb.bad{background:var(--bad-soft);border:1px solid var(--bad)}
.fb .v{font-weight:700;font-size:15px}
.warn.bad{color:#9b2222;background:#fde4e4}
@media (prefers-color-scheme: dark){.warn.bad{color:#ffb3b3;background:#3d1a1a}}
.warn{font-size:13px;font-weight:700;color:#a35a00;background:#fff3d6;border-radius:10px;padding:6px 10px}
@media (prefers-color-scheme: dark){.warn{color:#ffd48a;background:#3d2e10}}
.fb.ok .v{color:var(--ok)} .fb.bad .v{color:var(--bad)}
.hintline{min-height:20px;color:var(--muted);font-size:14px;font-family:var(--font-latin);letter-spacing:.08em}

/* result */
.ring{width:150px;height:150px;position:relative;margin:0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tr{stroke:var(--sea-soft)} .ring .pr{stroke:var(--sea);transition:stroke-dashoffset .6s}
.ring div{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-display);font-size:34px}
.wlist{display:flex;flex-direction:column}
.wlist>div{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.wlist>div:first-child{border-top:0}
.wlist b{font-family:var(--font-latin)}

/* lists */
details{border-top:1px solid var(--line);padding:2px 0}
details:first-child{border-top:0}
summary{list-style:none;display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 0;cursor:pointer;min-height:48px}
summary::-webkit-details-marker{display:none}
summary b{font-family:var(--font-latin);font-size:15px}
.dbody{display:flex;flex-direction:column;gap:8px;padding:0 0 14px}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0}.pager .btn{flex:1}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sea-soft);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:10px;padding:10px;font-weight:700;color:var(--muted);min-height:44px}
.seg button.on{background:var(--surface);color:var(--sea);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.stages{display:flex;gap:4px}
.stages i{width:16px;height:6px;border-radius:3px;background:var(--line)}
.stages i.on{background:var(--ok)}

/* stats */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.stat .n{font-family:var(--font-display);font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .h{text-align:center;font-size:12px;color:var(--muted);padding-bottom:2px}
.cal button{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-variant-numeric:tabular-nums;padding:0}
.cal button.e{visibility:hidden}
.cal button.a1{background:var(--sea-soft);border-color:var(--sea);color:var(--sea);font-weight:700}
.cal button.a2{background:var(--sea);border-color:var(--sea);color:#fff;font-weight:700}
:root[data-theme="dark"] .cal button.a2{color:#06182B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .cal button.a2{color:#06182B}}
.cal button.now{box-shadow:0 0 0 2px var(--coral)}
.cal button.sel{outline:3px solid var(--ink);outline-offset:1px}
.stat,.grid2{display:none}
.srow{display:grid;grid-template-columns:34px 1fr 1fr 1fr;align-items:center;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}.srow .sl{font-weight:800;font-size:13px;color:var(--sea)}
.srow .n{font-family:var(--font-display);font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums}
.wbars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end}
.wb{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px}
.wb .wc{height:84px;width:100%;display:flex;align-items:flex-end;background:var(--sea-soft);border-radius:8px;overflow:hidden}
.wb .wc i{display:block;width:100%;background:var(--sea);border-radius:8px 8px 0 0;min-height:2px}
.wb.now .wc i{background:var(--coral)}.wb .wv{height:14px;font-variant-numeric:tabular-nums;font-weight:700}.wb .wl{color:var(--muted)}.wb.now .wl{color:var(--coral);font-weight:800}
.bar.gold i{background:linear-gradient(90deg,#f5c431,#ff9f43)}.bar.mini{height:5px;width:100%}
.recent{display:flex;align-items:center;gap:8px;padding:4px 0 6px}.recent .medal{width:38px;height:38px;font-size:18px;border-width:2px}
.bgroup{display:flex;flex-direction:column;gap:10px;padding-top:6px;border-top:1px solid var(--line)}
.medal{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:29px;position:relative;overflow:hidden;border:3px solid #cdd5e0;background:#e4e9f0;box-shadow:inset 0 -4px 8px rgba(0,0,0,.08)}
.medal span{filter:grayscale(1);opacity:.35}.medal img{width:100%;height:100%;object-fit:cover;filter:grayscale(1);opacity:.4}
.medal.on span{filter:none;opacity:1;text-shadow:0 2px 4px rgba(0,0,0,.25)}.medal.on img{filter:none;opacity:1}
.medal.on::after{content:"";position:absolute;top:-30%;left:-60%;width:40%;height:160%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);transform:rotate(20deg);animation:shine 3.6s ease-in-out infinite}
@keyframes shine{0%,55%{left:-60%}100%{left:130%}}
.medal.on.t-b{background:radial-gradient(circle at 30% 25%,#f7d2b0,#cd7f32 60%,#8c4f1f);border-color:#e6a46b;box-shadow:0 3px 8px rgba(140,79,31,.45),inset 0 -4px 8px rgba(0,0,0,.2)}
.medal.on.t-s{background:radial-gradient(circle at 30% 25%,#fff,#cfd5de 55%,#8a94a6);border-color:#e4e9f2;box-shadow:0 3px 9px rgba(90,100,120,.5),inset 0 -4px 8px rgba(0,0,0,.15)}
.medal.on.t-g{background:radial-gradient(circle at 30% 25%,#fff6bf,#f5c431 55%,#c58a0a);border-color:#ffe27a;box-shadow:0 0 12px rgba(245,196,49,.65),0 3px 8px rgba(160,110,0,.5),inset 0 -4px 8px rgba(0,0,0,.18)}
.medal.on.t-d{background:radial-gradient(circle at 30% 25%,#eafcff,#5ed3f3 55%,#2a7de1);border-color:#b8f0ff;box-shadow:0 0 14px rgba(70,190,255,.8),0 3px 8px rgba(20,80,180,.5),inset 0 -4px 8px rgba(0,0,0,.18)}
.medal.on.t-l{background:conic-gradient(from 0deg,#ff6b9d,#ffd23f,#4cd964,#35c8ff,#a66bff,#ff6b9d);border-color:#fff;box-shadow:0 0 16px rgba(255,120,200,.85),0 0 28px rgba(120,160,255,.55);animation:glow 2.4s ease-in-out infinite}
.medal.on.t-l span{background:rgba(255,255,255,.75);border-radius:50%;width:78%;height:78%;display:grid;place-items:center}
@keyframes glow{50%{box-shadow:0 0 22px rgba(255,200,80,.95),0 0 34px rgba(255,100,200,.7)}}
@media (prefers-reduced-motion: reduce){.medal.on::after,.medal.on.t-l{animation:none}}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 8px}
.badge{text-align:center;font-size:12px;display:flex;flex-direction:column;gap:3px;align-items:center;color:var(--muted)}
.badge .bn{font-weight:800;color:var(--muted);font-size:12px;line-height:1.25}.badge.on .bn{color:var(--ink)}.badge .bd{font-size:11px;font-variant-numeric:tabular-nums}
.pbar{display:flex;flex-direction:column;gap:6px}

/* settings */
.toggle{display:flex;gap:8px;flex-wrap:wrap}
.toggle button{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:700;min-height:44px}
.toggle button.on{border-color:var(--sea);background:var(--sea-soft);color:var(--sea)}
.stepper{display:flex;align-items:center;gap:12px}
.stepper .v{font-family:var(--font-display);font-size:36px;min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
textarea{width:100%;min-height:80px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;font-size:13px}
label.lbl{font-weight:700;font-size:14px}
input[type=date]{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;min-height:44px}

/* dict */
.search{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;font-size:16px;background:var(--surface);color:var(--ink);min-height:48px}
.search:focus{outline:2px solid var(--sea);border-color:var(--sea)}
.fchips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.fchips button{flex:none;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:7px 12px;font-weight:700;font-size:13px;min-height:36px}
.fchips button.on{background:var(--sea);border-color:var(--sea);color:#fff}
.st-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--line)}
.st-dot.l{background:var(--sea)}.st-dot.w{background:var(--coral)}.st-dot.m{background:#2e9e6a}
.wk{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:6px 0;border-top:1px solid var(--line)}
.kbd{font-size:12px;color:var(--muted);text-align:center}
/* nav */
#nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:5}
#nav .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
#nav button{border:0;background:none;border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700;color:var(--muted);min-height:54px;position:relative}
#nav button.on{color:var(--sea);background:var(--sea-soft)}
#nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

"U-shaped learning": "A pattern in which performance is {correct}, gets worse, then becomes correct again.",

"peer review": "The process in which learners {evaluate} each other's work.",

};

(function(){const DF={"allegory": "A story in which characters and events stand for {abstract} ideas or moral meanings.", "irony": "A contrast between what is said or expected and what actually {happens} or is meant.", "simile": "A figure of speech that {compares} two unlike things using the word like or as.", "foreshadowing": "A hint in a narrative about events that will {occur} later in the story.", "soliloquy": "A speech in which a character speaks their thoughts {aloud} while alone on stage.", "protagonist": "The central {character} of a story, around whom the main conflict revolves.", "antagonist": "A character or force that {opposes} the main character.", "satire": "A work that uses humor and exaggeration to {criticize} human folly or social problems.", "motif": "A recurring {element}, such as an image or idea, that develops a work's theme.", "allusion": "An indirect {reference} to a person, event or work outside the text.", "unreliable": "Describing a narrator whose account cannot be fully {trusted}.", "stanza": "A group of {lines} in a poem, forming a unit like a paragraph in prose.", "sonnet": "A fourteen-line poem with a fixed {rhyme} scheme, usually in iambic pentameter.", "alliteration": "The {repetition} of the same initial consonant sound in nearby words.", "onomatopoeia": "A word that {imitates} the sound it describes.", "paradox": "A statement that seems self-{contradictory} but may reveal a deeper truth.", "oxymoron": "A figure of speech that combines two {opposite} terms in one phrase.", "juxtaposition": "The placing of two contrasting elements side by side to highlight their {differences}.", "epiphany": "A sudden moment of {realization} or insight, often experienced by a character.", "imagery": "Descriptive language that appeals to the {senses} to create pictures in the reader's mind.", "symbolism": "The use of objects or images to represent {ideas} beyond their literal meaning.", "personification": "Giving human {qualities} to animals, objects or abstract ideas.", "hyperbole": "Deliberate and extreme {exaggeration} used for emphasis or effect.", "understatement": "A figure of speech that deliberately makes something seem {less} important than it is.", "pathos": "The quality in a work that arouses {pity} or sadness in the audience.", "catharsis": "The emotional {release} an audience feels, especially at the end of a tragedy.", "tragic flaw": "A defect in a hero's {character} that causes their downfall.", "hubris": "Excessive {pride} or self-confidence that leads to a character's ruin.", "denouement": "The final part of a plot in which the {outcome} is resolved after the climax.", "climax": "The point of greatest {tension} or turning point in a story.", "exposition": "The part of a narrative that {introduces} the background, setting and characters.", "flashback": "A scene that {interrupts} the main timeline to show an earlier event.", "setting": "The time and {place} in which a story occurs.", "theme": "The central {message} or underlying idea explored in a literary work.", "tone": "The author's {attitude} toward the subject or audience, conveyed through word choice.", "point of view": "The {perspective} from which a story is told, such as first or third person.", "stream of consciousness": "A narrative technique that records the continuous flow of a character's {thoughts}.", "epigraph": "A short quotation placed at the {beginning} of a book or chapter.", "prologue": "An introductory section that comes {before} the main story begins.", "epilogue": "A concluding section that comes {after} the main story ends.", "elegy": "A poem of serious {reflection}, typically mourning someone who has died.", "ode": "A lyric poem written in {praise} of a person, object or idea.", "ballad": "A narrative poem or song that tells a {story}, often in short stanzas.", "couplet": "Two successive lines of poetry that usually {rhyme} and have the same meter.", "blank verse": "Poetry written in regular iambic pentameter but with no {rhyme}.", "iambic pentameter": "A line of verse with five {feet}, each an unstressed syllable followed by a stressed one.", "meter": "The {pattern} of stressed and unstressed syllables in a line of poetry.", "rhyme scheme": "The {pattern} of rhyming sounds at the ends of lines, often marked with letters.", "enjambment": "The continuation of a sentence beyond the end of a poetic {line} without a pause.", "assonance": "The {repetition} of similar vowel sounds in nearby words.", "consonance": "The repetition of consonant sounds, especially at the {ends} of nearby words.", "romanticism": "A movement that emphasized {emotion}, imagination and nature over reason.", "modernism": "A movement that broke from {tradition} with experimental forms in the early twentieth century.", "realism": "A movement that portrays {everyday} life and society as they truly are.", "gothic": "A genre that blends horror, mystery and {decay} in dark, atmospheric settings.", "bildungsroman": "A novel that follows a young character's psychological and moral {growth} into adulthood.", "dystopia": "An imagined society marked by {oppression} and suffering, often as a warning.", "utopia": "An imagined {perfect} society in which everything is ideal.", "comic relief": "A humorous scene or character that {eases} tension in a serious work.", "foil": "A character who {contrasts} with another in order to highlight that character's traits.", "archetype": "A universal {pattern}, character type or symbol that recurs across literature.", "anachronism": "Something placed in the wrong {period} of history, such as a modern object in an old story.", "canon": "The body of works regarded as the most {important} or authoritative in a field."};
WORDS.forEach(w=>{if(DF[w.w]&&!w.df)w.df=DF[w.w];});
})();

(function(){
/* [term, ipa, pos, ko, example, definition, phenomenon] */
const R=[
["place of articulation","/pleɪs əv ɑːrˌtɪkjuˈleɪʃn/","n.","조음 위치","The {place of articulation} of /p/ is bilabial.","The point in the vocal tract where the {airstream} is {obstructed} to produce a consonant.","Comparing /p/, /t/ and /k/: all are voiceless stops, but the lips or the tongue block the air at different points in the mouth."],
["manner of articulation","/ˈmænər əv ɑːrˌtɪkjuˈleɪʃn/","n.","조음 방법","/t/ and /s/ differ in {manner of articulation}: stop versus fricative.","The way the {airflow} is modified in the vocal tract to produce a {consonant}, such as a stop or a fricative.","/t/ and /s/ are made at the same position, but /t/ blocks the air completely while /s/ lets it slip through a narrow gap."],
["voiceless","/ˈvɔɪsləs/","adj.","무성의","/s/ is a {voiceless} fricative.","Describing a sound produced without {vibration} of the {vocal} cords.","/p/, /t/, /k/ and /s/ are made with the vocal cords held apart, so a finger on the throat feels no buzz."],
["coarticulation","/ˌkoʊɑːrtɪkjuˈleɪʃn/","n.","동시 조음","The lips round for /s/ in 'soon' because of {coarticulation}.","The overlap of {articulatory} gestures of neighboring sounds, so that one sound is influenced by the {next}.","In 'soon' the lips are already rounded during the /s/, in anticipation of the following vowel."],
["nasalization","/ˌneɪzəlaɪˈzeɪʃn/","n.","비음화","The vowel in 'can't' undergoes {nasalization}.","A process in which a {vowel} acquires a nasal quality because it is next to a {nasal} consonant.","The vowel in 'ban' is pronounced partly through the nose because it comes right before /n/."],
["dissimilation","/dɪˌsɪmɪˈleɪʃn/","n.","이화","'Marble' shows {dissimilation} from French 'marbre'.","A process in which two {similar} sounds in a word become {different}.","'Marble' comes from French 'marbre': one of the two /r/ sounds became /l/ so that the same sound was not repeated."],
["haplology","/hæpˈlɑːlədʒi/","n.","중음 탈락","Saying 'probly' for 'probably' is an example of {haplology}.","The {omission} of a syllable when two identical or {similar} syllables occur in sequence.","'Probably' is often pronounced 'probly' and 'library' is often said 'libry': a repeated stretch of sound simply drops out."],
["free variation","/friː ˌveriˈeɪʃn/","n.","자유 변이","Released and unreleased final /t/ occur in {free variation}.","The occurrence of two or more sounds in the same {environment} without a change in {meaning}.","A speaker may say the final /t/ of 'cat' released or unreleased on different occasions, with no predictable rule and no change in meaning."],
["complementary distribution","/ˌkɑːmplɪˈmentri ˌdɪstrɪˈbjuːʃn/","n.","상보적 분포","Aspirated and unaspirated [p] are in {complementary distribution}.","A relationship in which two sounds never occur in the same {environment}, suggesting they are {allophones} of one phoneme.","[pʰ] appears only at the start of a stressed syllable and [p] only after /s/; the two sounds never occur in the same position."],
["distinctive feature","/dɪˈstɪŋktɪv ˈfiːtʃər/","n.","변별적 자질","[voice] is a {distinctive feature} that separates /p/ from /b/.","A phonetic property, such as voicing or nasality, that {distinguishes} one phoneme from {another}.","/p/ and /b/ share place and manner of articulation; the only property separating them is whether the vocal cords vibrate."],
["sonority","/səˈnɑːrəti/","n.","공명도","Vowels have higher {sonority} than stops.","The relative {loudness} or perceptibility of a sound, which determines its position in a {syllable}.","In 'plant' the perceptibility rises from /p/ through /l/ to the vowel, then falls through /n/ to /t/."],
["syllabic consonant","/sɪˈlæbɪk ˈkɑːnsənənt/","n.","성절 자음","The /n/ in 'button' is a {syllabic consonant}.","A consonant that forms the {nucleus} of a {syllable} without a vowel.","In casual speech 'bottle' and 'button' still have two syllables even though the second one contains no vowel sound."],
["intrusive r","/ɪnˈtruːsɪv ɑːr/","n.","끼어드는 r","'Law and order' is said with an {intrusive r}.","An /r/ inserted between two {vowels} in non-rhotic accents even where none is {spelled}.","Some British speakers say 'idea-r-of' and 'law-r-and order', adding an /r/ where the spelling has none."],
["Great Vowel Shift","/ɡreɪt ˈvaʊəl ʃɪft/","n.","대모음추이","The {Great Vowel Shift} explains why 'bite' and 'beet' look so unlike their old forms.","A major change in the pronunciation of English {long} vowels between about 1400 and 1700, when they became {higher} or diphthongized.","Chaucer's 'name' /naːmə/ became modern /neɪm/ and 'mice' /miːs/ became /maɪs/ over a few centuries, which explains odd spelling-sound mismatches."],
["TH-fronting","/ˌtiː eɪtʃ ˈfrʌntɪŋ/","n.","th 전방음화","'Fink' for 'think' is an example of {TH-fronting}.","A pronunciation feature in which {interdental} fricatives are replaced by {labiodental} ones.","Some London speakers say 'fink' for 'think' and 'bruvver' for 'brother'."],
["yod-dropping","/jɒd ˈdrɑːpɪŋ/","n.","요드 탈락","American 'tune' is a case of {yod-dropping}.","The loss of the {glide} /j/ between a consonant and the {vowel} /uː/, as in American 'news' /nuːz/.","Americans say 'tune' /tuːn/ and 'duty' /duːti/ while many British speakers say /tjuːn/ and /djuːti/."],

["clitic","/ˈklɪtɪk/","n.","접어","The 'll in 'she'll' is a {clitic}.","A reduced form that functions as a word syntactically but must {attach} to a {host} word phonologically.","The 's in 'John's here' and the 'll in 'she'll go' cannot stand alone in speech; they lean on the word before."],
["infix","/ˈɪnfɪks/","n.","삽입사","In 'abso-bloody-lutely', the word 'bloody' works like an {infix}.","An affix inserted inside the {root} of a word rather than at its {edge}.","'Fan-freaking-tastic' and 'abso-bloody-lutely' insert an expletive into the middle of a single word."],
["circumfix","/ˈsɜːrkəmfɪks/","n.","환접사","German 'ge-...-t' is a {circumfix}.","A {discontinuous} affix that surrounds a {base}, appearing on both sides of it.","In German 'spielen' becomes 'gespielt' by adding material before and after the verb stem together."],
["endocentric compound","/ˌendoʊˈsentrɪk ˈkɑːmpaʊnd/","n.","내심 복합어","'Blackboard' is an {endocentric compound}.","A compound that is a {hyponym} of one of its parts, which serves as its {head}.","A 'blackboard' is a kind of board and a 'toothbrush' is a kind of brush: one part names the category."],
["exocentric compound","/ˌeksoʊˈsentrɪk ˈkɑːmpaʊnd/","n.","외심 복합어","'Redhead' is an {exocentric compound}.","A compound whose meaning is not a {kind} of either part, because it has no internal {head}.","A 'redhead' is a person, not a kind of head, and a 'pickpocket' is a thief, not a kind of pocket."],
["cranberry morpheme","/ˈkrænberi ˈmɔːrfiːm/","n.","크랜베리 형태소","'Cran-' in 'cranberry' is a {cranberry morpheme}.","A bound {morpheme} that occurs in only one {word}, so its separate meaning cannot be identified.","In 'cranberry', 'huckleberry' and 'boysenberry', the first part has no independent meaning anywhere else in the language."],
["eponym","/ˈepənɪm/","n.","인명 유래어","'Sandwich' is an {eponym}.","A word derived from the {name} of a {person} or place, such as 'sandwich' or 'boycott'.","'Sandwich' comes from the Earl of Sandwich and 'boycott' from Captain Boycott, a land agent in Ireland."],
["calque","/kælk/","n.","번역 차용","German 'Wolkenkratzer' is a {calque} of 'skyscraper'.","A word or phrase borrowed by {literal} translation of its parts into the {borrowing} language.","French 'gratte-ciel', German 'Wolkenkratzer' and Spanish 'rascacielos' were each built by translating 'sky-scraper' piece by piece."],
["loanword","/ˈloʊnwɜːrd/","n.","차용어","'Kindergarten' is a {loanword} from German.","A word adopted from {another} language with little change in form, such as 'karaoke' from {Japanese}.","English took 'karaoke' and 'tsunami' from Japanese and 'kindergarten' from German essentially unchanged."],
["ablaut","/ˈæblaʊt/","n.","모음 교체","'Sing, sang, sung' shows {ablaut}.","A change in the internal {vowel} of a word that marks a {grammatical} difference.","The past of 'sing' is 'sang' and the past of 'drive' is 'drove': the tense changes only by replacing the vowel inside the word."],
["lexical gap","/ˈleksɪkl ɡæp/","n.","어휘적 공백","English has a {lexical gap} for 'the day after tomorrow'.","A concept for which a language has no single {word}, though it can be {expressed} in a phrase.","English has no single word for 'the day after tomorrow', whereas German has 'übermorgen'."],
["folk etymology","/foʊk ˌetɪˈmɑːlədʒi/","n.","민간어원","'Sparrow grass' for 'asparagus' is a {folk etymology}.","A change in a word's form caused by a mistaken {popular} belief about its {origin}.","Speakers reshaped 'asparagus' as 'sparrow grass', and Spanish 'cucaracha' became 'cockroach' as if it were built from 'cock' and 'roach'."],

["specifier","/ˈspesɪfaɪər/","n.","지정어","'The' is the {specifier} of the noun phrase 'the book'.","In X-bar theory, the element that combines with an intermediate projection to form a full {phrase}, often a {determiner} or a subject.","In a tree diagram of 'the book', the word 'the' occupies the position that completes the noun phrase, sister to the intermediate N' node."],
["wh-movement","/ˈdʌbljuː eɪtʃ ˈmuːvmənt/","n.","의문사 이동","'What did you see?' involves {wh-movement}.","A syntactic operation that moves a {question} word to the front of a clause, leaving a {gap}.","'You saw what' becomes 'What did you see __?' with the question word shifted to the start of the sentence."],
["raising","/ˈreɪzɪŋ/","n.","상승","'John seems to be happy' involves {raising}.","A construction in which the {subject} of an embedded clause moves to the subject position of the {main} clause.","In 'Mary seems to like jazz', Mary is the one who likes jazz but is the grammatical subject of 'seems'."],
["control","/kənˈtroʊl/","n.","통제","In 'John tried to leave', {control} gives 'leave' its subject.","A relation in which the unexpressed {subject} of an infinitive is interpreted as identical to an {argument} of the main verb.","In 'Tom tried to leave', the person who is to leave is understood to be Tom even though no subject is pronounced before 'leave'."],
["garden-path sentence","/ˈɡɑːrdn pæθ ˈsentəns/","n.","정원길 문장","'The old man the boats' is a {garden-path sentence}.","A grammatical sentence that leads the reader to an initial {misparsing} and forces {reanalysis}.","Readers stumble on 'The old man the boats' because they first read 'man' as a noun and must then reinterpret it as a verb."],
["center embedding","/ˈsentər ɪmˈbedɪŋ/","n.","중심 내포","'The rat the cat chased died' shows {center embedding}.","A structure in which a clause is placed in the {middle} of another clause, making it {hard} to process.","'The rat the cat the dog chased bit ran away' is grammatical, but the clauses nested in the middle make it nearly unreadable."],
["unaccusative","/ˌʌnəˈkjuːzətɪv/","adj.","비대격의","'Melt' and 'arrive' are {unaccusative} verbs.","Describing an intransitive verb whose single {argument} is a patient-like {subject}.","In 'The ice melted' and 'The train arrived', the subject does not deliberately perform the action but undergoes it."],
["unergative","/ʌnˈɜːrɡətɪv/","adj.","비능격의","'Run' and 'laugh' are {unergative} verbs.","Describing an intransitive verb whose single {argument} is an {agent} that performs the action.","In 'The child laughed' and 'The dog ran', the subject deliberately carries out the action."],
["pro-drop","/proʊ drɑːp/","n.","주어 생략","Italian is a {pro-drop} language.","A property of languages that allow the {subject} pronoun to be omitted because verb {agreement} or context recovers it.","Italian 'Parlo inglese' means 'I speak English' with no subject word, whereas English cannot leave out the subject in this way."],
["dangling modifier","/ˈdæŋɡlɪŋ ˈmɑːdɪfaɪər/","n.","현수 수식어","'Walking to school, the rain started' contains a {dangling modifier}.","A modifier that has no clear {word} to modify in the sentence, creating an {illogical} meaning.","'Walking to school, the rain started' wrongly suggests that the rain was walking."],
["reflexive pronoun","/rɪˈfleksɪv ˈproʊnaʊn/","n.","재귀대명사","In 'She hurt herself', 'herself' is a {reflexive pronoun}.","A pronoun ending in -self that refers back to the {subject} of the same {clause}.","In 'Mary saw herself in the mirror', the pronoun must refer to Mary and not to anyone else."],
["parallel structure","/ˈpærəlel ˈstrʌktʃər/","n.","병렬 구조","'She likes swimming, hiking and cycling' has {parallel structure}.","The use of the same grammatical form for items in a series or {coordinated} elements to create {balance}.","'He likes swimming, to hike and cycling' sounds wrong, whereas 'swimming, hiking and cycling' sounds balanced."],
["negative polarity item","/ˈneɡətɪv poʊˈlærəti ˈaɪtəm/","n.","부정극어","'Any' is a {negative polarity item}.","A word, such as 'any' or 'ever', that is {licensed} only in negative or {question} contexts.","'I didn't see anyone' is fine but 'I saw anyone' is odd; the word can appear only in negative or question contexts."],
["selectional restriction","/sɪˈlekʃənl rɪˈstrɪkʃn/","n.","선택 제약","'The rock ate lunch' violates a {selectional restriction}.","A semantic constraint on the {type} of noun a verb can take as its {argument}.","'The rock ate lunch' is odd because 'eat' normally requires an animate subject."],

["epistemic modality","/ˌepɪˈstiːmɪk moʊˈdæləti/","n.","인식적 양태","'It must be raining' expresses {epistemic modality}.","Modality that expresses the speaker's degree of {certainty} or {knowledge} about a proposition.","'She must be at home' and 'It might rain' show how sure the speaker is, not whether anyone is obliged to do anything."],
["deontic modality","/diˈɑːntɪk moʊˈdæləti/","n.","의무적 양태","'You must leave' expresses {deontic modality}.","Modality that expresses {obligation}, permission or {prohibition}.","'You must wear a seatbelt' and 'You may leave' concern what is required or allowed, not what is likely."],
["scalar implicature","/ˈskeɪlər ˈɪmplɪkeɪtʃər/","n.","척도 함축","'Some' implying 'not all' is a {scalar implicature}.","An inference that a speaker who uses a weaker term on a {scale} means that the stronger term does not {apply}.","If a teacher says 'Some students passed', listeners usually conclude that not all of them did."],
["conversational maxim","/ˌkɑːnvərˈseɪʃənl ˈmæksɪm/","n.","대화 격률","Grice proposed four {conversational maxims}.","One of Grice's {guidelines}, quantity, quality, relation and manner, that speakers normally {follow} to cooperate.","Be informative but no more than needed, be truthful, be relevant and be clear: four expectations behind ordinary talk."],
["phatic communion","/ˈfætɪk kəˈmjuːnjən/","n.","친교적 언어 사용","'Nice weather, isn't it?' is {phatic communion}.","Language used mainly to establish or maintain {social} contact rather than to exchange {information}.","'How are you?' and 'Nice weather today' are exchanged with neighbors without anyone wanting real information."],
["pragmatic transfer","/præɡˈmætɪk ˈtrænsfɜːr/","n.","화용적 전이","Refusing too bluntly because of L1 norms is {pragmatic transfer}.","The use of {native}-language rules of {appropriateness} when speaking a second language.","A learner translates a first-language way of refusing an invitation directly into English and sounds rude without meaning to."],
["cataphora","/kəˈtæfərə/","n.","후방 조응","In 'Before she spoke, Anna cleared her throat', 'she' shows {cataphora}.","The use of a pronoun that refers {forward} to an expression that appears {later} in the text.","In 'Before she spoke, Anna cleared her throat', the first pronoun points to a name mentioned afterward."],
["exophora","/ˌeksoʊˈfɔːrə/","n.","외부 조응","'Look at that!' is a case of {exophora}.","Reference to something in the {situation} outside the text rather than to an expression in the {discourse}.","Someone points and says 'Look at that!' with no earlier mention of what 'that' is."],
["substitution","/ˌsʌbstɪˈtuːʃn/","n.","대용","'I need a new one' uses {substitution}.","A cohesive device in which a word such as 'one' or 'do' replaces an earlier {item} to avoid {repetition}.","'I lost my pen; I need a new one' avoids repeating 'pen' by using a replacement word."],
["theme-rheme","/θiːm riːm/","n.","주제부-평언부","The {theme-rheme} division organizes a clause.","The division of a clause into the starting point, which is the {theme}, and the new information added about it, which is the {rheme}.","In 'Yesterday the manager resigned', the opening element sets the starting point and the rest of the clause adds the news."],
["vagueness","/ˈveɪɡnəs/","n.","모호성","The word 'tall' shows {vagueness}.","The lack of a sharp {boundary} in the meaning of a word, such as 'tall' or '{young}'.","No one can say exactly how many centimeters make a person 'tall' or how many years make someone 'old'."],
["contradiction","/ˌkɑːntrəˈdɪkʃn/","n.","모순","'It is raining and it is not raining' is a {contradiction}.","A relation in which two sentences cannot both be {true} at the same {time}.","'The door is open' and 'The door is closed' cannot both describe the same door at the same moment."],

["overt prestige","/ˈoʊvɜːrt ˈprestiːʒ/","n.","공공연한 위신","Preferring the news-reader accent reflects {overt prestige}.","Social value attached to a standard or high-status {variety} that speakers openly {admire}.","Speakers say they prefer the 'correct' accent of newsreaders and professionals."],
["covert prestige","/ˈkoʊvɜːrt ˈprestiːʒ/","n.","은밀한 위신","Local vernacular forms enjoy {covert prestige} among many men.","Positive {value} attached to a non-standard variety, shown in actual {usage} rather than in stated attitudes.","Men in a survey claim to speak standard English but are recorded using local forms that signal toughness and group loyalty."],
["speech accommodation","/spiːtʃ əˌkɑːməˈdeɪʃn/","n.","언어 적응","Slowing down for a foreigner is {speech accommodation}.","Adjusting one's way of {speaking} toward or away from that of the {interlocutor}.","A speaker slows down and uses simpler words with a foreigner, or exaggerates a local accent to stress group identity."],
["matched-guise test","/mætʃt ɡaɪz test/","n.","짝지은 말투 검사","A {matched-guise test} reveals hidden language attitudes.","A research technique in which listeners {evaluate} recordings of the same bilingual speaker using different languages or {varieties}.","Listeners hear what they think are different speakers, actually one person in two accents, and rate the standard accent as more intelligent."],
["isogloss","/ˈaɪsəɡlɑːs/","n.","등어선","The {isogloss} separates 'pop' areas from 'soda' areas.","A line on a map marking the {boundary} of an area where a particular linguistic feature is {used}.","On a dialect map, one line separates the region that says 'pop' from the region that says 'soda'."],
["dialect continuum","/ˈdaɪəlekt kənˈtɪnjuːəm/","n.","방언 연속체","Dutch and German form a {dialect continuum}.","A chain of {varieties} in which neighboring ones are mutually intelligible but distant ones are {not}.","Villages along the Dutch-German border understand their neighbors, yet speakers from the two ends of the chain cannot communicate."],
["language death","/ˈlæŋɡwɪdʒ deθ/","n.","언어 소멸","The loss of Manx is an example of {language death}.","The {disappearance} of a language when its last {speakers} die or stop using it.","When the last fluent first-language speaker of Manx died in 1974, the language no longer had native users."],
["heritage language","/ˈherɪtɪdʒ ˈlæŋɡwɪdʒ/","n.","계승어","Korean is her {heritage language}.","A {minority} language spoken at home by an immigrant community, often with {incomplete} acquisition in children.","A child born in the U.S. speaks Korean at home with her grandparents but uses English at school and with friends."],
["code-mixing","/koʊd ˈmɪksɪŋ/","n.","코드 혼합","Using Spanish words inside an English clause is {code-mixing}.","The use of elements of two languages {within} a single sentence or clause, usually without a change of {topic}.","'I'll see you after the 회의' blends two languages inside a single sentence."],
["language planning","/ˈlæŋɡwɪdʒ ˈplænɪŋ/","n.","언어 계획","Standardizing spelling is part of {language planning}.","Deliberate government or institutional {efforts} to influence the use, status or {structure} of a language.","A country decides to standardize spelling, create new technical vocabulary and make one language compulsory in schools."],
["vernacular","/vərˈnækjələr/","n.","토착어, 일상어","She uses the {vernacular} with friends.","The everyday {spoken} language of ordinary people in a community, as opposed to a formal or {standard} one.","Teachers use formal English in lessons but chat in the local street speech with their friends."],

["aphasia","/əˈfeɪʒə/","n.","실어증","A stroke can cause {aphasia}.","A language {disorder} caused by damage to the {brain}, affecting speaking or understanding.","After a stroke, a patient can no longer find words or follow speech, though her intelligence is otherwise intact."],
["Broca's aphasia","/ˈbroʊkəz əˈfeɪʒə/","n.","브로카 실어증","Halting speech is typical of {Broca's aphasia}.","A language disorder marked by halting, {agrammatic} speech with relatively intact {comprehension}.","A patient says 'Walk dog park' slowly and with effort, but understands what others say to him."],
["Wernicke's aphasia","/ˈvɜːrnɪkiz əˈfeɪʒə/","n.","베르니케 실어증","Fluent nonsense is typical of {Wernicke's aphasia}.","A language disorder marked by fluent but {meaningless} speech and poor {comprehension}.","A patient speaks smoothly and quickly, but the words make little sense and she does not understand what is said to her."],
["lateralization","/ˌlætərəlaɪˈzeɪʃn/","n.","편측화","Language shows {lateralization} to the left hemisphere.","The {specialization} of one hemisphere of the brain, usually the {left}, for language functions.","In most right-handed people, damage to the left side of the brain, not the right, produces serious speech problems."],
["babbling","/ˈbæblɪŋ/","n.","옹알이","Infants start {babbling} at about six months.","The {repetitive} consonant-vowel {sequences} produced by infants from about six months, such as 'bababa'.","A seven-month-old repeatedly produces strings like 'ma-ma-ma' and 'da-da-da' without any meaning."],
["holophrastic stage","/ˌhɑːləˈfræstɪk steɪdʒ/","n.","일어문 단계","'Milk!' is typical of the {holophrastic stage}.","The stage at which a child uses a single {word} to express a whole {sentence} meaning.","A toddler says 'Milk!' to mean 'I want some milk', using one word to convey a full message."],
["telegraphic speech","/ˌtelɪˈɡræfɪk spiːtʃ/","n.","전보식 발화","'Mommy go work' is {telegraphic speech}.","Child speech that omits {function} words and inflections, keeping only {content} words.","'Mommy go work' and 'Daddy car' leave out small grammatical words, like a telegram."],
["overextension","/ˌoʊvərɪkˈstenʃn/","n.","과잉 확장","Calling every animal 'doggie' is {overextension}.","A child's use of a word for a {wider} {range} of objects than adults do, such as calling every animal a 'dog'.","A two-year-old calls cats, cows and horses 'doggie' and calls the moon a 'ball'."],
["underextension","/ˌʌndərɪkˈstenʃn/","n.","과소 확장","Using 'cup' only for one's own cup is {underextension}.","A child's use of a word for a narrower set of {referents} than adults do, such as using 'cup' only for one {particular} cup.","A child uses 'bird' only for the sparrow at the window and does not apply the word to ducks or eagles."],
["child-directed speech","/tʃaɪld dəˈrektɪd spiːtʃ/","n.","아동 지향어","Sing-song talk to babies is {child-directed speech}.","The simplified, high-pitched {speech} that caregivers use with young children, with short sentences and {repetition}.","A mother speaks in a sing-song voice, slowly and with exaggerated intonation, repeating short phrases to her baby."],
["spoonerism","/ˈspuːnərɪzəm/","n.","두음 전환","'Our queer old dean' for 'our dear old queen' is a {spoonerism}.","A {slip} of the tongue in which the initial sounds of two words are {swapped}.","Saying 'You have hissed my mystery lecture' instead of 'You have missed my history lecture'."],
["tip-of-the-tongue phenomenon","/tɪp əv ðə tʌŋ fɪˈnɑːmɪnɑːn/","n.","설단 현상","Forgetting a familiar name is a {tip-of-the-tongue phenomenon}.","The experience of knowing a word but being temporarily {unable} to {retrieve} it.","You know the word starts with 'm' and has three syllables, yet you cannot say it right now."],
["priming","/ˈpraɪmɪŋ/","n.","점화","'Doctor' speeds recognition of 'nurse' through {priming}.","The effect in which exposure to one {stimulus} speeds up the recognition of a related {item}.","People recognize the word 'nurse' faster if they have just seen the word 'doctor'."],
["lexical access","/ˈleksɪkl ˈækses/","n.","어휘 접근","{Lexical access} takes only milliseconds.","The mental process of {retrieving} a word and its {properties} from the lexicon.","In milliseconds, a listener hears the sounds /kæt/ and activates the stored word along with its meaning."],

["etymology","/ˌetɪˈmɑːlədʒi/","n.","어원(학)","{Etymology} explains why 'nice' once meant 'foolish'.","The study of the {origin} of words and how their forms and meanings have {changed}.","Tracing 'nice' back to a Latin word meaning 'ignorant' and seeing how it changed over centuries."],
["language family","/ˈlæŋɡwɪdʒ ˈfæməli/","n.","어족","English belongs to the Indo-European {language family}.","A group of languages that {descend} from a common {ancestor}.","English, German and Dutch resemble each other because they all come from one earlier language."],
["Grimm's law","/ɡrɪmz lɔː/","n.","그림의 법칙","{Grimm's law} links Latin 'pater' with English 'father'.","A systematic {sound} change in Proto-Germanic in which Indo-European stops became {fricatives}.","Latin 'pater' and 'piscis' correspond to English 'father' and 'fish', where /p/ regularly became /f/."],
["sound change","/saʊnd tʃeɪndʒ/","n.","음변화","The silent k in 'knight' results from {sound change}.","A regular {shift} in the pronunciation of a sound across a language over {time}.","Across generations the /k/ in 'knight' stopped being pronounced in every word beginning with kn-."],
["grammatical gender","/ɡrəˈmætɪkl ˈdʒendər/","n.","문법적 성","French has {grammatical gender}.","A system that classifies {nouns} into categories such as masculine and feminine, shown through {agreement}.","In French a table is 'la table' and a book is 'le livre', even though neither object has a sex."],
["language contact","/ˈlæŋɡwɪdʒ ˈkɑːntækt/","n.","언어 접촉","{Language contact} produces loanwords.","The situation in which speakers of different languages {interact} and influence one {another}.","Traders from several countries meet regularly at a port and borrow words from each other's speech."],
["diachronic","/ˌdaɪəˈkrɑːnɪk/","adj.","통시적","A {diachronic} study compares Old and Modern English.","Describing the study of a language's {development} over {time}.","A study compares Old English, Middle English and modern English to see how the verb system developed."],
["synchronic","/sɪŋˈkrɑːnɪk/","adj.","공시적","A {synchronic} description covers present-day English only.","Describing the study of a language at a particular {moment} in time without {reference} to its history.","A description of the grammar of present-day American English without any discussion of how it developed."],
["arbitrariness","/ˌɑːrbɪˈtrerinəs/","n.","자의성","The {arbitrariness} of the sign means 'dog' could have been any sound.","The lack of a natural {connection} between a word's form and its {meaning}.","There is nothing dog-like about the sounds in 'dog', and other languages use 'chien' or 'inu' for the same animal."],
["duality of patterning","/duːˈæləti əv ˈpætərnɪŋ/","n.","이중 분절","{Duality of patterning} lets a few sounds make thousands of words.","The property of language in which meaningless {sounds} combine into meaningful {units}.","The meaningless sounds /k/, /æ/ and /t/ combine to form a word with meaning, and words combine to form sentences."],
["displacement","/dɪsˈpleɪsmənt/","n.","전위성","{Displacement} lets us talk about yesterday.","The ability of language to refer to things not {present} in space or {time}.","People can talk about yesterday's lunch, next year's holiday or a dragon that does not exist."]
];

function mergeState(a,b){

  const newer=(a.ts||0)>=(b.ts||0),n=newer?a:b,o=newer?b:a,m=JSON.parse(JSON.stringify(n));

function applyRemote(r){

}
function syncSchedule(){

async function syncPush(){
  if(!SYNC.on||!SYNC.ref)return;
  if(SYNC.busy){clearTimeout(SYNC.timer);SYNC.timer=setTimeout(syncPush,1500);return;}
  if(SYNC.pending){const r=SYNC.pending;SYNC.pending=null;if(r.ts>(S.ts||0))applyRemote(r);}

  catch(e){SYNC.status='err';}
  SYNC.busy=false;
}
async function syncPull(){

}
async function syncStart(ref){
  try{
    SYNC.ref=ref;
    const t=new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),10000));
    const snap=await Promise.race([ref.get(),t]);
    let changed=false;
    if(snap.exists){const r=snap.data();if(r&&r.json)changed=applyRemote(r);}
    else if(!pristine(S)){SYNC.dirty=true;}
    SYNC.on=true;SYNC.status='ok';SYNC.last=Date.now();
    if(SYNC.dirty&&!pristine(S)){S.ts=Math.max(S.ts||0,Date.now());saveLocal();syncPush();}
    if(changed){ensureToday();if(!['study','quiz','qsetup'].includes(view)){render();toast('다른 기기의 기록을 불러왔어요');}}
    else if(view==='settings')render();
    SYNC.unsub=ref.onSnapshot(sn=>{
      if(!sn.exists||(sn.metadata&&sn.metadata.hasPendingWrites))return;
      const r=sn.data();if(!r||!r.json||!(r.ts>(S.ts||0)))return;
      if(['study','quiz','qsetup'].includes(view)){SYNC.pending=r;return;}
      if(applyRemote(r)){ensureToday();render();toast('다른 기기의 기록을 불러왔어요');}
    },()=>{});
  }catch(e){SYNC.on=false;SYNC.status='err';if(view==='settings')render();}
}

const AUD={};let SPK_OK=null;
function speakAudio(w){
  const play=u=>{const a=new Audio(u);return a.play();};
  if(AUD[w]){play(AUD[w]).catch(()=>toast('소리를 재생하지 못했어요'));return;}
  if(/\s/.test(w)||!/^[A-Za-z'-]+$/.test(w)){toast('이 기기에서는 구절 발음을 지원하지 않아요');return;}
  fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(w.toLowerCase())).then(r=>r.json()).then(j=>{
    const ph=[].concat(...(Array.isArray(j)?j:[]).map(e=>e.phonetics||[])).filter(p=>p.audio);
    const p=ph.find(p=>/-us\./i.test(p.audio))||ph[0];
    if(!p)throw 0;AUD[w]=p.audio;return play(p.audio);
  }).catch(()=>toast('이 기기에서는 발음 재생을 지원하지 않아요'));
}
function speak(w){
  const ss=window.speechSynthesis;
  if(!ss||!window.SpeechSynthesisUtterance||SPK_OK===false){speakAudio(w);return;}
  try{
    const u=new SpeechSynthesisUtterance(w);u.lang='en-US';u.rate=.9;
    const vs=ss.getVoices?ss.getVoices():[];
    const v=vs.find(v=>/^en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang));if(v)u.voice=v;
    let started=false;u.onstart=()=>{started=true;SPK_OK=true;};
    u.onerror=()=>{if(!started){SPK_OK=SPK_OK===true?true:false;speakAudio(w);}};
    ss.cancel();ss.speak(u);
    setTimeout(()=>{if(!started&&!ss.speaking){SPK_OK=false;speakAudio(w);}},900);
  }catch(e){speakAudio(w);}
}

function makePlan(batch){
  const n=S.set.daily, cats=S.set.cats.length?S.set.cats:Object.keys(CATS);
  const hash=t=>{let h=7;for(let i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))>>>0;return h;};
  const groups=cats.map(c=>{const g=WORDS.filter(w=>w.cat===c&&!S.hide[w.w]&&!S.learned[w.w]&&!(c==='read'&&S.set.hard!==false&&w.easy));return c==='read'?g.sort((a,b)=>hash(a.w)-hash(b.w)):g;});
  const ids=[];let i=0;
  const wt=cats.map(c=>c==='read'?2:1);
  while(ids.length<n&&groups.some((g,gi)=>g.length>i*wt[gi])){groups.forEach((g,gi)=>{for(let j=0;j<wt[gi];j++){const w=g[i*wt[gi]+j];if(w&&ids.length<n)ids.push(w.w);}});i++;}
  return {date:TODAY(),ids,idx:0,studyDone:false,quizDone:false,batch:batch||1};
}

function blankChoices(w,t){
  const keys=dfKeys(w);if(!keys.length)return null;
  const lc=x=>x.toLowerCase();
  const pw=shuffle(WORDS.filter(x=>x.w!==w.w&&!S.hide[x.w]&&x.df&&dfKeys(x).length));
  const same=pw.filter(x=>x.cat===w.cat),pool=same.length>=6?same:pw;
  const used=new Set(keys.map(lc)),loose=[];
  pool.forEach(x=>dfKeys(x).forEach(k=>{if(!used.has(lc(k))&&!loose.includes(k)&&!(w.df||'').toLowerCase().includes(lc(k)))loose.push(k);}));
  let list;
  if(t==='dcloze'){
    const c=dfTarget(w);list=[c].concat(loose.slice(0,3));
  }else{
    const ans=keys.join(' / '),set=[ans],add=a=>{const x=a.join(' / ');if(!set.includes(x))set.push(x);};
    if(keys.length>1){const r=keys.slice().reverse();add(r);if(keys.length>2)add(keys.slice(1).concat(keys[0]));}
    for(let i=0;i<8&&set.length<4;i++){const a=keys.slice();a[i%keys.length]=loose[(i*2)%Math.max(1,loose.length)]||a[i%keys.length];if(loose.length)add(a);}
    for(let i=0;i<8&&set.length<4&&loose.length>=keys.length;i++){add(keys.map((_,j)=>loose[(i*keys.length+j)%loose.length]));}
    list=set.slice(0,4);
  }
  if(list.length<3)return null;
  const c0=list[0],sh=shuffle(list);return {list:sh,ci:sh.indexOf(c0)};
}
function buildQ(id,types){
  const w=BY[id];
  const okT=types.filter(x=>x==='mc'||x==='short'||(x==='cloze'&&/\{.+?\}/.test(w.ex||''))||((x==='def'||x==='dcloze')&&w.df)||(x==='dmulti'&&dfKeys(w).length>1)||(x==='phen'&&w.ph));
  let t=pick(okT.length?okT:['mc']);
  if(t==='phen'&&Math.random()<.45){
    let pool=shuffle(WORDS.filter(x=>x.w!==w.w&&!S.hide[x.w]&&x.cat===w.cat&&x.ph));
    if(pool.length<3)pool=shuffle(WORDS.filter(x=>x.w!==w.w&&!S.hide[x.w]&&x.cat===w.cat));
    return {id,type:'mc',dir:'p2t',opts:shuffle([w].concat(pool.slice(0,3))).map(o=>o.w)};
  }
  if(t==='dcloze'||t==='dmulti'){const ch=blankChoices(w,t);if(ch)return {id,type:'mc',dir:t,choices:ch.list,ci:ch.ci};t='def';}
  if(isM(w)){
    if(t==='short')t='def';
    if(t==='mc'){
      const dir=Math.random()<.5?'d2t':'t2d';
      let pool=shuffle(WORDS.filter(x=>x.w!==w.w&&!S.hide[x.w]&&x.cat===w.cat&&x.df));
      const opts=shuffle([w].concat(pool.slice(0,3)));
      return {id,type:'mc',dir,opts:opts.map(o=>o.w)};
    }
  }
  if(t==='mc'){
    const dir=Math.random()<.5?'en2ko':'ko2en';
    let pool=shuffle(WORDS.filter(x=>x.w!==w.w&&!S.hide[x.w]&&x.ko!==w.ko));
    const sc=x=>(x.pos===w.pos?2:0)+(x.cat===w.cat?1:0);
    pool.sort((a,b)=>sc(b)-sc(a));
    const opts=shuffle([w].concat(pool.slice(0,3)));
    return {id,type:'mc',dir,opts:opts.map(o=>o.w)};
  }
  return {id,type:t};
}

function pager(total,pg,size,act){const n=Math.max(1,Math.ceil(total/size));if(n<2)return '';return `<div class="pager"><button class="btn" data-a="${act}" data-v="${pg-1}" ${pg<=0?'disabled':''} aria-label="이전 페이지">‹ 이전</button><span class="muted small"><b>${pg+1}</b> / ${n}</span><button class="btn" data-a="${act}" data-v="${pg+1}" ${pg>=n-1?'disabled':''} aria-label="다음 페이지">다음 ›</button></div>`;}
function wstat(id){return S.wrong[id]?'w':S.master[id]?'m':S.learned[id]?'l':'n';}
function dictMatch(){
  const q=DQ.q.trim().toLowerCase();

    if(DQ.cat!=='all'&&w.cat!==DQ.cat)return false;
    const st=wstat(w.w);
    const hid=!!S.hide[w.w];
    if(DQ.st==='hid'){if(!hid)return false;}else if(hid)return false;
    if(DQ.st==='new'&&st!=='n')return false;
    if(DQ.st==='learned'&&st==='n')return false;
    if(DQ.st==='wrong'&&st!=='w')return false;
    if(DQ.st==='mark'&&!S.marks[w.w])return false;
    if(q&&!(w.w.toLowerCase().includes(q)||(w.ko||'').includes(q)||(w.df||'').toLowerCase().includes(q)))return false;

function dictList(){

function applyEffect(id,ok){
  const td=TODAY();
  if(Q.mode==='daily'){
    if(!ok){const o=S.wrong[id];S.wrong[id]={box:0,due:addDays(td,1),miss:(o?o.miss:0)+1};delete S.master[id];}
  }else if(Q.mode==='review'){
    const o=S.wrong[id];if(!o)return;
    if(ok){const b=o.box+1;if(b>=INT.length){delete S.wrong[id];S.master[id]=td;}else S.wrong[id]={box:b,due:addDays(td,INT[b]),miss:o.miss};}
    else S.wrong[id]={box:0,due:addDays(td,1),miss:o.miss+1};
  }else if(Q.mode==='mock'){
    if(!ok){const o=S.wrong[id];if(o)S.wrong[id]={box:0,due:addDays(td,1),miss:o.miss+1};}
  }
}
function answer(ok,given,note){
  Q.answered=true;Q.last={ok,given,note};Q.res.push({id:Q.items[Q.idx].id,ok});
  S.stats.answered++;if(ok)S.stats.correct++;
  {const c=BY[Q.items[Q.idx].id].cat;const cs=S.stats.cat||(S.stats.cat={});const o=cs[c]||(cs[c]={a:0,c:0});o.a++;if(ok)o.c++;}
  const a=A();a.qtot++;if(ok)a.qok++;
  applyEffect(Q.items[Q.idx].id,ok);save();render();
}

/* ---- lenient grading ---- */
const compact=t=>norm(t).replace(/[ ']/g,'');
const toks=t=>norm(t).replace(/'s\b/g,'').replace(/'/g,'').split(' ').filter(Boolean);
const sameT=(a,b)=>a===b||a===b+'s'||a===b+'es'||b===a+'s'||b===a+'es';
const KB=(()=>{const rows=['qwertyuiop','asdfghjkl','zxcvbnm'],off=[0,.25,.75],m={};rows.forEach((r,y)=>[...r].forEach((c,x)=>{m[c]=[x+off[y],y];}));return m;})();
const isV=c=>'aeiou'.includes(c);
const adjK=(a,b)=>{const p=KB[a],q=KB[b];return !!p&&!!q&&a!==b&&Math.abs(p[0]-q[0])<=1.01&&Math.abs(p[1]-q[1])<=1;};
/* typed (v) vs target (t), both compact. slip = phone typing slip, near = looks like a real spelling error */
function typoKind(v,t){
  if(v===t)return null;
  const lv=v.length,lt=t.length;
  if(lv===lt){
    const d=[];for(let i=0;i<lv;i++)if(v[i]!==t[i])d.push(i);
    if(d.length===1){const a=v[d[0]],b=t[d[0]];
      if(adjK(a,b)&&!(isV(a)&&isV(b)))return {slip:true,kind:`${a}↔${b} 옆 키`};
      return {near:true};}
    if(d.length===2&&d[1]===d[0]+1&&v[d[0]]===t[d[1]]&&v[d[1]]===t[d[0]]){
      if(isV(v[d[0]])&&isV(v[d[1]]))return {near:true};
      return {slip:true,kind:'두 글자 순서 바뀜'};}
    return null;
  }
  if(lv===lt+1){
    let near=false;
    for(let i=0;i<lv;i++){if(v.slice(0,i)+v.slice(i+1)!==t)continue;
      const c=v[i],p=v[i-1],n=v[i+1];
      if(c===p||c===n)return {slip:true,kind:'같은 글자 두 번 눌림'};
      if(!isV(c)&&((p&&adjK(c,p))||(n&&adjK(c,n))))return {slip:true,kind:'옆 키가 같이 눌림'};
      near=true;}
    return near?{near:true}:null;
  }
  if(lv===lt-1){
    let near=false;
    for(let i=0;i<lt;i++){if(t.slice(0,i)+t.slice(i+1)!==v)continue;
      const c=t[i];
      if(c===t[i-1]||c===t[i+1]){near=true;continue;}
      if(!isV(c))return {slip:true,kind:'글자 하나 빠짐'};
      near=true;}
    return near?{near:true}:null;
  }
  return null;
}
let CMP=null;
function typoCheck(cv,ct,target){
  if(ct.length<5)return {ok:false};
  const k=typoKind(cv,ct);
  if(!k)return {ok:false};
  if(!CMP)CMP=new Set(WORDS.map(x=>compact(x.w)));
  if(CMP.has(cv))return {ok:false};
  if(k.slip)return {ok:true,note:`오타로 봤어요(${k.kind}) · 정확한 표기는 ${target}`};
  return {ok:false,note:`한 글자 차이지만 오타가 아니라 철자 오류로 봤어요 · 정확한 표기는 ${target}`};
}
function grade(it,w,v,tgt){
  const target=tgt||targetOf(it,w);
  if(norm(v)===norm(target))return {ok:true};
  const cv=compact(v),ct=compact(target);
  if(!cv)return {ok:false};
  if(cv===ct)return {ok:true,note:`정확한 표기는 ${target}`};
  if(!MAJOR[w.cat])return typoCheck(cv,ct,target);
  // major terms: accept extra words around the term (e.g. "task-based approach") and plurals
  const tv=toks(v),tt=toks(target);
  if(tt.length&&tv.length>tt.length&&tv.length-tt.length<=2){
    for(let i=0;i+tt.length<=tv.length;i++){
      if(tt.every((t,j)=>sameT(tv[i+j],t)))return {ok:true,note:`정확한 용어는 ${target}`};
    }
  }
  if(tv.length===tt.length&&tt.every((t,j)=>sameT(tv[j],t)))return {ok:true,note:`정확한 표기는 ${target}`};
  return typoCheck(cv,ct,target);
}
function checkInput(){
  const it=Q.items[Q.idx],w=BY[it.id];
  if(it.type==='dmulti'){
    const keys=dfKeys(w),vals=keys.map((k,i)=>(document.getElementById('ans'+i)||{value:''}).value);
    if(vals.some(x=>!norm(x))){toast('모든 빈칸을 채워 주세요');return;}
    const gs=keys.map((k,i)=>grade(it,w,vals[i],k)),all=gs.every(g=>g.ok),notes=[];
    gs.forEach((g,i)=>{if(!g.ok)notes.push(`${i+1}번 빈칸 정답: ${keys[i]}${g.note&&/철자/.test(g.note)?' (철자 오류)':''}`);else if(g.note)notes.push(`${i+1}번 ${g.note}`);});
    answer(all,vals.map(x=>x.trim()).join(' / '),notes.join(' · '));return;
  }
  const v=document.getElementById('ans').value;
  if(!norm(v)){toast('답을 입력해 주세요');return;}
  const target=targetOf(it,w);
  const g=grade(it,w,v);
  answer(g.ok,v.trim(),g.note);
}

/* ---- word lookup (web dictionaries; needs internet) ---- */
async function fetchJ(url,ms){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms||7000);try{const r=await fetch(url,{signal:c.signal});if(!r.ok)throw new Error('http');return await r.json();}finally{clearTimeout(t);}}
const POS_EN={noun:'n.',verb:'v.',adjective:'adj.',adverb:'adv.',preposition:'prep.',conjunction:'conj.',pronoun:'pron.',interjection:'interj.'};
const POS_KO={'명사':'n.','동사':'v.','형용사':'adj.','부사':'adv.','전치사':'prep.','접속사':'conj.','대명사':'pron.','감탄사':'interj.'};
async function lookupWord(word){
  const out={w:word,ipa:'',pos:'',ko:'',ex:'',ok:false};let enPos='';
  try{
    const j=await fetchJ('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(word));
    const e=Array.isArray(j)?j[0]:null;
    if(e){
      let ipa=e.phonetic||'';
      if(!ipa||!/[\/\[]/.test(ipa)){const p=(e.phonetics||[]).find(x=>x.text);if(p)ipa=p.text;}
      out.ipa=ipa&&!/^\/.*\/$/.test(ipa)?'/'+ipa.replace(/^[\[\/]|[\]\/]$/g,'')+'/':ipa;
      const m=(e.meanings||[])[0];if(m){enPos=m.partOfSpeech||'';out.pos=POS_EN[enPos]||'';}
      for(const mm of (e.meanings||[])){if(enPos&&mm.partOfSpeech!==enPos)continue;const d=(mm.definitions||[]).find(x=>x.example);if(d){out.ex=d.example;break;}}
      out.ok=true;
    }
  }catch(e){}
  try{
    const j=await fetchJ('https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ko&dt=t&dt=bd&q='+encodeURIComponent(word));
    const bd=j&&j[1];
    if(bd&&bd.length){
      let ent=bd.find(x=>POS_KO[x[0]]===out.pos)||bd[0];
      if(!out.pos)out.pos=POS_KO[ent[0]]||'';
      out.ko=(ent[1]||[]).slice(0,3).join(', ');
    }
    if(!out.ko&&j&&j[0]&&j[0][0])out.ko=j[0][0][0]||'';
    if(out.ko)out.ok=true;
  }catch(e){}
  if(!out.ko){
    try{const j=await fetchJ('https://api.mymemory.translated.net/get?q='+encodeURIComponent(word)+'&langpair=en|ko');
      const t=j&&j.responseData&&j.responseData.translatedText;if(t&&!/MYMEMORY|QUERY LENGTH/i.test(t)){out.ko=t;out.ok=true;}}catch(e){}
  }
  if(out.ex){const re=new RegExp('\\b('+word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'[a-z]*)','i');out.ex=re.test(out.ex)?out.ex.replace(re,'{$1}'):out.ex;}
  return out;
}

 'unhide-all':()=>{const m=dictMatch();if(!DQ.arm){DQ.arm=true;dictRefresh();return;}DQ.arm=false;m.forEach(w=>delete S.hide[w.w]);save();dictRefresh();toast(m.length+'개 숨김을 해제했어요');},
 'hide-card':()=>{
   const id=ST.ids[ST.idx];hideWords([id],true);ST.ids.splice(ST.idx,1);
   if(ST.src==='today'&&S.today){const k=S.today.ids.indexOf(id);if(k>=0)S.today.ids.splice(k,1);S.today.idx=Math.min(ST.idx,S.today.ids.length);save();}

 'sync-now':async()=>{if(!SYNC.on){toast('동기화를 쓸 수 없는 상태예요');return;}toast('동기화 중…');try{const ch=await syncPull();await syncPush();SYNC.last=Date.now();if(ch)ensureToday();render();toast(ch?'다른 기기의 기록을 불러왔어요':'동기화 완료');}catch(e){SYNC.status='err';render();toast('동기화에 실패했어요');}},

 'enmajor-toggle':()=>{S.set.enMajor=S.set.enMajor===false;save();render();},
 'auto-toggle':()=>{S.set.auto=!S.set.auto;save();render();},
 speak:d=>speak(d.w),
 reveal:()=>{ST.rev=true;render();},
 'toggle-hide':()=>{ST.hide=!ST.hide;ST.rev=false;S.set.hideDef=ST.hide;save();render();},
 'leave-study':()=>{go(ST.src==='today'||ST.src==='again'?'home':'review');},
 'toggle-type':d=>{const t=S.set.types,i=t.indexOf(d.t);if(i>=0){if(t.length>1)t.splice(i,1);else toast('유형은 하나 이상 선택해야 해요');}else t.push(d.t);save();render();},

   Q={mode:PEND.mode,items:PEND.ids.map(id=>buildQ(id,S.set.types)),idx:0,answered:false,last:null,res:[],hint:false};go('quiz');},

 hint:()=>{const it=Q.items[Q.idx],w=BY[it.id];Q.hint=true;document.getElementById('hint').textContent=hintIt(it,w);},
 skip:()=>{if(!Q.answered)answer(false,'');},
 'next-q':()=>{if(Q.idx>=Q.items.length-1){finishQuiz();return;}Q.idx++;Q.answered=false;Q.last=null;Q.hint=false;Q.more=false;render();window.scrollTo(0,0);},
 'leave-quiz':()=>{go('home');toast('진행한 결과까지만 저장됐어요');},
 'retry-wrong':()=>openQuiz(RES.ids,'retry'),
 'cal-prev':()=>{calM--;if(calM<0){calM=11;calY--;}render();},
 'cal-next':()=>{calM++;if(calM>11){calM=0;calY++;}render();},
 'cal-day':d=>{calSel=d.d;render();},
 daily:d=>{setDaily(S.set.daily+Number(d.n));},
 'daily-set':d=>setDaily(Number(d.n)),
 import:()=>{
   const lines=document.getElementById('imp').value.split('\n').map(x=>x.trim()).filter(Boolean);let added=0,skip=0;
   lines.forEach(l=>{const p=l.split('|').map(x=>x.trim());if(!p[0]||!p[3]){skip++;return;}
     if(BY[p[0]]&&BY[p[0]].cat!=='my'){skip++;return;}
     if(S.custom.some(c=>c.w===p[0])){skip++;return;}
     S.custom.push({w:p[0],ipa:p[1]||'',pos:p[2]||'',ko:p[3],ex:p[4]||''});added++;});
   applyCustom();if(added&&!S.set.cats.includes('my'))S.set.cats.push('my');
   if(added)replan();save();render();toast(added?`${added}개 추가했어요`+(skip?` (${skip}줄 건너뜀)`:''):'형식을 확인해 주세요: 단어 | 발음 | 품사 | 뜻 | 예문');},
 lookup:async()=>{
   const ta=document.getElementById('imp'),btn=document.getElementById('lkbtn'),msg=document.getElementById('lkmsg');
   const lines=ta.value.split('\n'),todo=lines.map((l,i)=>({l:l.trim(),i})).filter(x=>x.l&&!x.l.includes('|'));
   if(!todo.length){toast('단어만 적은 줄이 없어요. 한 줄에 단어 하나씩 적어 주세요');return;}
   btn.disabled=true;let okN=0,failN=0;
   for(let k=0;k<todo.length;k++){
     msg.textContent=`찾는 중… (${k+1}/${todo.length}) ${todo[k].l}`;
     const w=todo[k].l.replace(/\s+/g,' ');
     const r=await lookupWord(w);
     if(r.ko||r.ipa){lines[todo[k].i]=[w,r.ipa,r.pos,r.ko,r.ex].join(' | ');if(r.ko)okN++;else failN++;}
     else{failN++;}
     ta.value=lines.join('\n');
   }
   btn.disabled=false;
   msg.textContent=failN?`${okN}개 완성, ${failN}개는 뜻을 찾지 못했어요. 인터넷 연결을 확인하거나 직접 입력해 주세요.`:`${okN}개 완성했어요. 내용을 확인하고 '단어 추가하기'를 눌러 주세요.`;
 },
 'clear-custom':()=>{S.custom=[];applyCustom();S.set.cats=S.set.cats.filter(c=>c!=='my');if(!S.set.cats.length)S.set.cats=CAT_DEFAULT.slice();Object.keys(S.learned).forEach(k=>{if(!BY[k])delete S.learned[k];});replan();save();render();toast('삭제했어요');},
 'toggle-cat':d=>{const c=S.set.cats,i=c.indexOf(d.c);if(i>=0){if(c.length>1)c.splice(i,1);else toast('분야는 하나 이상 선택해야 해요');}else c.push(d.c);replan();save();render();},
 backup:()=>{const txt=JSON.stringify(S);try{navigator.clipboard.writeText(txt).then(()=>toast('백업 데이터를 복사했어요'),()=>fallbackBackup(txt));}catch(e){fallbackBackup(txt);}},
 restore:()=>{const v=document.getElementById('bk').value.trim();try{const p=JSON.parse(v);if(!p||!p.set||!p.att)throw 0;S=migrate(p);S.epoch=Date.now();applyCustom();save();toast('복원했어요');go('home');}catch(e){toast('백업 데이터 형식이 올바르지 않아요');}},
 reset:()=>{if(!resetArm){resetArm=true;render();return;}resetArm=false;S=fresh();S.epoch=Date.now();save();toast('초기화했어요');go('home');}
};
function fallbackBackup(txt){const t=document.getElementById('bk');if(t){t.value=txt;t.select();toast('아래 상자의 내용을 직접 복사해 주세요');}}
function hideWords(ids,keepPlan){ids.forEach(id=>{S.hide[id]=TODAY();delete S.wrong[id];delete S.marks[id];});if(!keepPlan&&S.today&&!S.today.studyDone)replan();save();}
function setDaily(n){S.set.daily=Math.max(5,Math.min(200,n));replan();save();render();}

  const a=e.target.closest('[data-a]');if(!a)return;
  const f=H[a.dataset.a];if(f)f(a.dataset,e);

let tx=null,ty=null;
document.addEventListener('touchstart',e=>{if(view!=='study'||e.touches.length!==1)return;tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
document.addEventListener('touchend',e=>{
  if(view!=='study'||tx===null)return;
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;tx=null;
  if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.8){if(dx<0)H['next-card']();else H['prev-card']();}
},{passive:true});
document.addEventListener('keydown',e=>{
  if(view==='study'&&!/INPUT|TEXTAREA/.test((e.target.tagName||''))){
    if(e.key==='ArrowRight'){H['next-card']();}
    else if(e.key==='ArrowLeft'){H['prev-card']();}
    else if(e.key===' '){e.preventDefault();if(ST.hide&&!ST.rev)H.reveal();else H['next-card']();}
    else if(e.key==='s'||e.key==='S'){speak(ST.ids[ST.idx]);}
    else if(e.key==='b'||e.key==='B'){H.bm({w:ST.ids[ST.idx]});}
    return;
  }
  if(view!=='quiz'||e.key!=='Enter')return;
  if(Q.answered){e.preventDefault();H['next-q']();}
  else if(/^ans\d*$/.test(e.target.id||'')){e.preventDefault();
    const all=[...document.querySelectorAll('.ansf')],k=all.indexOf(e.target);
    if(k>=0&&k<all.length-1&&!all[k+1].value)all[k+1].focus();else checkInput();}
});

/* ---- keep the study card a fixed size: shrink the text inside instead ---- */
function fitCard(){
  const c=document.querySelector('#app .wcard'),f=c&&c.querySelector('.wfit');
  if(!f)return;
  f.style.zoom='';
  const cs=getComputedStyle(c),avail=c.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  let z=1,g=0;
  while(z>0.45&&f.getBoundingClientRect().height>avail+0.5&&g++<40){z=+(z-.025).toFixed(3);f.style.zoom=z;}
}
/* ---- fit to screen (no scroll) ---- */
let MAXH=0,FITZ={view:null,z:1};
function clampTo(el,n){let sp=el.querySelector(':scope>.cl');
  if(!sp){sp=document.createElement('span');sp.className='cl';sp.innerHTML=el.innerHTML;el.innerHTML='';el.appendChild(sp);}
  sp.style.display='-webkit-box';sp.style.webkitBoxOrient='vertical';sp.style.webkitLineClamp=n;sp.style.overflow='hidden';}
const TZ=()=>window.innerWidth>=1000?1.4:window.innerWidth>=768?1.3:1;
function fitView(){
  const app=document.getElementById('app'),base=TZ();
  const nv=document.querySelector('#nav .in');if(nv)nv.style.zoom=base>1?base:'';
  const on=['study','quiz','qsetup'].includes(view)&&!(view==='quiz'&&Q&&Q.more);
  app.classList.toggle('fit',on);app.classList.toggle('holdmode',view==='study'&&!!ST.hide);app.style.zoom=base>1?base:'';
  if(!on){FITZ={view:null,z:1};return;}
  MAXH=Math.max(MAXH,window.innerHeight);
  const H=MAXH,over=()=>app.getBoundingClientRect().height>H+1;
  if(view==='quiz'){
    // never shrink text: trim long explanations and offer a "더보기" button instead
    app.querySelectorAll('[data-a=qmore]').forEach(b=>b.remove());
    app.querySelectorAll('.fb .cl').forEach(sp=>{sp.parentNode.innerHTML=sp.innerHTML;});
    app.querySelectorAll('.fb .ex,.fb .df').forEach(e=>{e.style.display='';});
    let clamped=false;app.classList.remove('tight');
    const tg=()=>[...app.querySelectorAll('.fb .ex,.fb .df')];
    const pass=min=>{for(const el of tg()){
      if(!over())return;
      const lh=parseFloat(getComputedStyle(el).lineHeight)||22,cs=getComputedStyle(el);let n=Math.round((el.getBoundingClientRect().height-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom))/lh);
      while(n>min&&over()){n--;clampTo(el,n);clamped=true;}}};
    pass(3);if(over()){app.classList.add('tight');pass(2);}
    if(over()){pass(1);}
    if(over()){for(const el of app.querySelectorAll('.fb .ex,.fb .df')){if(!over())break;el.style.display='none';clamped=true;}}
    if(clamped){const host=app.querySelector('.fb')||app.querySelector('.card.q');
      if(host){const b=document.createElement('button');b.className='btn block';b.dataset.a='qmore';b.textContent='설명 더보기';host.appendChild(b);if(over()){b.className='tiny';b.style.alignSelf='flex-end';}}
    }
    FITZ={view,z:1};return;
  }
  if(FITZ.view!==view)FITZ={view,z:1};
  let z=FITZ.z;
  if(z<1)app.style.zoom=z*base;
  let guard=0;
  while(z>0.5&&over()&&guard++<30){z=Math.max(.5,+(z-.03).toFixed(2));app.style.zoom=z*base;}
  FITZ.z=z;
}
window.addEventListener('resize',()=>{if(window.innerHeight<MAXH*0.7)return;MAXH=window.innerHeight;FITZ.z=1;fitView();});
window.addEventListener('orientationchange',()=>{MAXH=0;FITZ.z=1;setTimeout(fitView,200);});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{FITZ.z=1;fitView();});

/* ---- press-and-hold to peek at hidden meaning ---- */
let HOLDING=false;
function holdOn(e){
  if(view!=='study'||!ST.hide||ST.rev)return;
  if(e.target.closest&&e.target.closest('button,input,textarea,a'))return;
  HOLDING=true;document.querySelectorAll('#app .veil').forEach(x=>x.classList.add('unveil'));
  const h=document.querySelector('#app .tap-hint');if(h)h.style.visibility='hidden';
}
function holdOff(){
  if(!HOLDING)return;HOLDING=false;
  document.querySelectorAll('#app .veil').forEach(x=>x.classList.remove('unveil'));
  const h=document.querySelector('#app .tap-hint');if(h)h.style.visibility='';
}
document.addEventListener('touchstart',e=>{if(view==='study'&&ST.hide&&!ST.rev&&!(e.target.closest&&e.target.closest('button,input,textarea,a,select')))e.preventDefault();},{passive:false});
document.addEventListener('touchstart',holdOn,{passive:true});
document.addEventListener('mousedown',holdOn);
document.addEventListener('touchend',e=>{if(!e.touches||e.touches.length===0)holdOff();},{passive:true});
document.addEventListener('touchcancel',e=>{if(!e.touches||e.touches.length===0)holdOff();},{passive:true});
document.addEventListener('mouseup',holdOff);
window.addEventListener('blur',holdOff);
document.addEventListener('contextmenu',e=>{if(view==='study'&&ST.hide)e.preventDefault();});
document.addEventListener('selectstart',e=>{if(view==='study'&&ST.hide)e.preventDefault();});
document.addEventListener('dragstart',e=>{if(view==='study'&&ST.hide)e.preventDefault();});

ensureToday();render();syncInit();
